<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOW Video Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* tokens copied from the translation review page (not linked, that page is untouched) */
:root{--ink:#0B1023;--canvas:#FBFBF7;--card:#FFFFFF;--line:#E3E4EC;--muted:#5B6077;--violet:#7B4DFF;--blue:#4D7CFF;--green:#00A86B;--amber:#B86E00;--amber-bg:#FFF4E0;--edit-bg:#F2ECFF;
 --grad:linear-gradient(112deg,#A259FF,#4D7CFF 52%,#00D084);--f-ui:'Poppins',system-ui,-apple-system,sans-serif;--f-text:'Noto Sans','Noto Sans JP','Poppins',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#ECEEF6;--canvas:#0C0F1C;--card:#141829;--line:#262B42;--muted:#9AA0BA;--violet:#A98BFF;--blue:#86A6FF;--green:#38D69B;--amber:#FFB547;--amber-bg:#2D2410;--edit-bg:#241D3D;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--f-ui);font-size:14px;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
header.bar{position:sticky;top:0;z-index:5;background:var(--canvas);border-bottom:1px solid var(--line);padding:14px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.brand h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.04em}
.brand h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.brand p{margin:0;color:var(--muted);font-size:13px}
.pick{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn,button{font:500 13px var(--f-ui);color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--ink);color:var(--canvas);border-color:var(--ink)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{display:grid;grid-template-columns:330px 1fr;gap:20px;margin-top:18px}@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
summary{cursor:pointer;font-weight:600;padding:4px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
.row:hover,.row.sel{background:var(--edit-bg)}.chip{display:inline-flex;padding:3px 10px;border-radius:999px;background:var(--edit-bg);color:var(--violet);font-weight:500;font-size:12px;white-space:nowrap}
.s-New-file,.s-Changes-requested{background:var(--amber-bg);color:var(--amber)}.s-Waiting-for-Sarosh{background:var(--grad);color:#fff}.s-Approved{background:#e3f7ee;color:var(--green)}@media(prefers-color-scheme:dark){.s-Approved{background:#12302a}}
.sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 0}
video{width:100%;background:#000;border-radius:10px;max-height:58vh}.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}.seg button{border:0;background:transparent;color:var(--muted)}.seg button[aria-pressed=true]{background:var(--ink);color:var(--canvas)}.tabs button[aria-pressed=true]{background:var(--ink);color:var(--canvas)}.note{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.note img,.shot{width:150px;border-radius:8px;border:1px solid var(--line);background:#000;display:block}.tc{font-variant-numeric:tabular-nums;color:var(--blue);cursor:pointer;font-weight:600;border:0;background:none;padding:0}
.mut{color:var(--muted);font-size:13px}.fixed{opacity:.55}.prev{border:1.5px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px}
.note:not(:has(img)){grid-template-columns:1fr}.hist{font-size:13px;display:flex;flex-direction:column;gap:4px}.hist span b{font-weight:600}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--ink);color:var(--canvas);padding:8px 14px;border-radius:8px;display:none;max-width:90vw}
#pa{display:none}@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff}#pa .n{break-inside:avoid;display:grid;grid-template-columns:240px 1fr;gap:12px;border-top:1px solid #ccc;padding:8px 0}#pa img{width:240px}}
</style></head><body><div class="wrap"><header class="bar"><div class="brand"><h1>NOW <b>Video Review</b></h1><p id="mode"></p></div><div class="pick"><span class="seg" id="roles"><button data-r="Editors">Editors</button><button data-r="Reviewers">Reviewers</button><button data-r="Sarosh">Sarosh</button></span><select id="fs"><option value="">All statuses</option><option>New file</option><option>Ready for review</option><option>Changes requested</option><option>Waiting for Sarosh</option><option>Approved</option></select></div></header><main><div class="card" id="list">Loading…</div><div id="view"><div class="card mut">Pick a video on the left.</div></div></main></div><div id="msg"></div><div id="pa"></div>
<script src="config.js" onerror="void 0"></script>
<script>
const CFG=window.VR_CONFIG||{EXEC_URL:'',API_KEY:''}, DEMO=!CFG.EXEC_URL, $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q=new URLSearchParams(location.search), DEMO_BASE=Q.get('demo')==='nocors'?'http://localhost:18766/':'http://localhost:18767/';
let ROLE=(()=>{try{const r=localStorage.getItem('vr_role');return['Editors','Reviewers','Sarosh'].includes(r)?r:'Editors'}catch(e){return'Editors'}})();let D={docs:[],tree:[],notes:[],events:[],unclear:[]}, sel=null, selV=null, pend=null, shotCache={}, busy=false, closed=new Set();
function toast(m){const e=$('#msg');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',5000)}
/* ---------- data layer: Apps Script (live) or localStorage (demo) ---------- */
const DEMO_TREE=[{pillar:'MINDSET',lang:'ENGLISH',code:'MS01',final:null,versions:[{v:1,id:'demo_v1',name:'MS01 (1).mp4',date:'2026-10-20 09:10 UTC'},{v:2,id:'demo_v2',name:'MS01_fixed.mp4',date:'2026-10-21 12:40 UTC'}]},
 {pillar:'MINDSET',lang:'ENGLISH',code:'MS02',final:null,versions:[{v:1,id:'demo_v1',name:'MS02.mp4',date:'2026-10-21 08:00 UTC'}]},
 {pillar:'MINDSET',lang:'GERMAN',code:'MS01',final:{id:'demo_v1'},versions:[]},
 {pillar:'PROTECT',lang:'ITALIAN',code:'P01',final:null,versions:[{v:1,id:'demo_v1',name:'P01 ita.mp4',date:'2026-10-21 07:00 UTC'}]}];
const DEMO_UNCLEAR=[{pillar:'MINDSET',lang:'POLISH',name:'final render.mp4',why:'no code in the name'}];
const SEED={notes:[{id:'nseed1',key:'MINDSET|ENGLISH|MS01',v:1,tc:12.4,tcText:'00:12.400 (f372)',text:'Title is cut off on the right edge.',by:'Anna',at:'2026-10-20 10:05 UTC',shotId:'',fixed:false}],
 events:[{key:'MINDSET|ENGLISH|MS01',v:1,type:'uploaded',by:'Ed',at:'2026-10-20 09:12 UTC'},{key:'MINDSET|ENGLISH|MS01',v:1,type:'changes',by:'Anna',at:'2026-10-20 10:06 UTC'},{key:'MINDSET|ENGLISH|MS01',v:2,type:'resubmitted',by:'Ed',at:'2026-10-21 12:45 UTC'},
 {key:'MINDSET|ENGLISH|MS02',v:1,type:'uploaded',by:'Ed',at:'2026-10-21 08:05 UTC'},{key:'MINDSET|ENGLISH|MS02',v:1,type:'ok',by:'Anna',at:'2026-10-21 09:30 UTC'}]};
const ls=()=>JSON.parse(localStorage.getItem('vr_demo3')||JSON.stringify(SEED));
async function api(action,body){
  if(!DEMO){const r=body&&action!=='v_shot'?await fetch(CFG.EXEC_URL,{method:'POST',body:JSON.stringify({action,...body})}):await fetch(CFG.EXEC_URL+'?action='+action+'&'+new URLSearchParams(body||{}));
    const j=await r.json();if(!j.ok)throw new Error(j.message||j.code);return j}
  const s=ls(),save=()=>localStorage.setItem('vr_demo3',JSON.stringify(s)),b=body;
  if(action==='v_all')return{ok:1,tree:DEMO_TREE,notes:s.notes.map(n=>({...n,image:undefined})),events:s.events,docs:s.docs||[],unclear:DEMO_UNCLEAR};
  if(action==='v_shot')return{ok:1,data:(s.notes.find(n=>n.shotId===b.id)||{}).image};
  if(action==='v_note'){const id='n'+Math.random().toString(36).slice(2,10);s.notes.push({id,key:b.key,v:b.v,tc:b.tc,tcText:b.tcText,text:b.text,by:b.by,at:nowS(),shotId:b.image?id:'',image:b.image,fixed:false});save();return{ok:1}}
  if(action==='v_fixed'){const n=s.notes.find(n=>n.id===b.id);n.fixed=b.on;n.fixedBy=b.by;save();return{ok:1}}
  if(action==='v_event'){s.events.push({key:b.key,v:b.v,type:b.type,by:b.by,at:nowS(),docId:b.docId||''});save();return{ok:1}}
  if(action==='v_doc'){DEMO_TREE.forEach(i=>i.versions.forEach(x=>{x.doc=x.doc||'demodoc'+x.v}));return{ok:1}}
  if(action==='v_refresh'){s.docs=s.docs||[];if(!s.docs.some(d=>d.key===b.key&&d.v===b.v&&d.by==='ALL'))s.docs.push({key:b.key,v:b.v,docId:'demoall',by:'ALL',at:nowS()});save();return{ok:1}}
  if(action==='v_newdoc'){s.docs=s.docs||[];s.docs.push({key:b.key,v:b.v,docId:'demo'+Math.random().toString(36).slice(2,8),by:b.by,at:nowS()});save();return{ok:1}}
  if(action==='v_approve'){if(b.pin!=='123456')throw new Error('Wrong PIN (demo PIN is 123456).');s.events.push({key:b.key,v:b.v,type:'approved',by:'Sarosh',at:nowS()});save();return{ok:1}}
}
const nowS=()=>new Date().toISOString().slice(0,16).replace('T',' ')+' UTC';
const fileUrl=id=>DEMO?DEMO_BASE+id+'.mp4':`https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${CFG.API_KEY||D.apiKey||''}`;
/* ---------- status is DERIVED from the version history + notes + Final mark ---------- */
const keyOf=i=>`${i.pillar}|${i.lang}|${i.code}`, notesOf=(k,v)=>D.notes.filter(n=>n.key===k&&Number(n.v)===v), evOf=k=>D.events.map((e,x)=>[e,x]).filter(p=>p[0].key===k).sort((a,b)=>a[0].at<b[0].at?-1:a[0].at>b[0].at?1:a[1]-b[1]).map(p=>p[0]);
const latest=i=>Math.max(0,...i.versions.map(x=>x.v));
function status(i){const k=keyOf(i),N=latest(i);if(!N)return i.final?'Approved':'New file';const e=evOf(k).pop();if(!e)return'New file';
 if(e.type==='approved')return e.v===N?'Approved':'New file';
 if(e.v<N)return e.type==='changes'?'Changes requested':'New file';
 return{uploaded:'Ready for review',resubmitted:'Ready for review',changes:'Changes requested',ok:'Waiting for Sarosh'}[e.type]}
const cls=s=>'s-'+s.replace(/\s/g,'-');
const chgNames=i=>{const N=latest(i),n=evOf(keyOf(i)).filter(e=>e.type==='changes'&&e.v===N);return n.length?`<br><span class="mut" style="font-size:12px">${n.map(e=>'Changes by '+esc(e.by)).join(' · ')}</span>`:''};
const TAG={uploaded:e=>`Uploaded by ${e.by}`,resubmitted:e=>`Ready for review after changes - ${e.by}`,changes:e=>`Changes by ${e.by}`,ok:e=>`Reviewed by ${e.by} - OK`,approved:e=>`Approved by ${e.by}`};
async function load(){if(!D.tree.length){try{const c=JSON.parse(localStorage.getItem('vr_cache')||'null');if(c&&c.tree){D=c;renderList()}}catch(e){}}try{D=await api('v_all');try{localStorage.setItem('vr_cache',JSON.stringify({tree:D.tree,notes:D.notes,events:D.events,docs:D.docs,unclear:D.unclear,apiKey:D.apiKey}))}catch(e){}}catch(e){toast('Could not load: '+e.message);return}renderList();if(sel)renderView(true)}
function renderList(){const f=$('#fs').value,g={};
 const show={Editors:()=>true,Reviewers:(s,i)=>s==='Ready for review'||s==='New file'||(s==='Changes requested'&&(evOf(keyOf(i)).pop()||{}).v===latest(i)),Sarosh:s=>s==='Waiting for Sarosh'||s==='Approved'};
 D.tree.forEach(i=>{const s=status(i);if((f&&s!==f)||!show[ROLE](s,i))return;((g[i.pillar]??={})[i.lang]??=[]).push([i,s])});
 const un=(D.unclear||[]).length?`<div class="prev" style="margin:0 0 8px"><b>${D.unclear.length} file(s) need a name with the video code</b> (e.g. MS01):<br>${D.unclear.map(u=>`<span class="mut">${esc(u.pillar)}/${esc(u.lang)}/${esc(u.name)} - ${esc(u.why)}</span>`).join('<br>')}</div>`:'';
 const op=id=>closed.has(id)?'':'open';
 const todo=ROLE==='Editors'?D.tree.filter(i=>['New file','Changes requested'].includes(status(i))):[];
 const wb='';
 const tb=todo.length?`<div class="sec">To do (${todo.length})</div>${todo.map(i=>`<div class="row" data-k="${esc(keyOf(i))}"><span>${esc(i.pillar)} / ${esc(i.lang)} / ${esc(i.code)}</span><span class="chip ${cls(status(i))}">${status(i)}</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--line)">`:'';
 $('#list').innerHTML=(ROLE==='Editors'?un:'')+tb+wb+(Object.keys(g).sort().map(p=>`<details data-id="${esc(p)}" ${op(p)}><summary>${esc(p)}</summary>${Object.keys(g[p]).sort().map(l=>`<details data-id="${esc(p+'/'+l)}" ${op(p+'/'+l)} style="margin-left:10px"><summary class="mut">${esc(l)}</summary>${g[p][l].sort((a,b)=>a[0].code.localeCompare(b[0].code)).map(([i,s])=>`<div class="row ${sel===keyOf(i)?'sel':''}" data-k="${esc(keyOf(i))}"><span>${esc(i.code)} <span class="mut">${i.versions.length?'v'+latest(i):''}</span>${chgNames(i)}</span><span class="chip ${cls(s)}">${s}</span></div>`).join('')}</details>`).join('')}</details>`).join('')||'<span class="mut">'+({Editors:'No videos yet.',Reviewers:'Nothing is waiting for review.',Sarosh:'Nothing is waiting for you.'})[ROLE]+'</span>');
 document.querySelectorAll('#list details').forEach(d=>d.ontoggle=()=>d.open?closed.delete(d.dataset.id):closed.add(d.dataset.id));
 document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{sel=r.dataset.k;selV=null;pend=null;renderList();renderView()})}
const item=()=>D.tree.find(i=>keyOf(i)===sel);
function fmt(t){const ms=Math.floor(t*1000),m=Math.floor(ms/60000),s=(ms-m*60000)/1000;return String(m).padStart(2,'0')+':'+s.toFixed(3).padStart(6,'0')+' (f'+Math.round(t*30000/1001)+')'}
function sources(i){const a=i.versions.map(x=>({lab:'v'+x.v,v:x.v,id:x.id,sub:(x.date||'').slice(5,10)}));if(!a.length&&i.final)a.push({lab:'Final',v:0,id:i.final.id,sub:''});return a}
function actions(i,cur,st){const N=latest(i),isLast=cur.v===N&&N>0;if(!isLast)return'';
 const B=(id,l,c)=>`<button id="${id}" class="${c||''}">${l}</button>`;
 const m={Editors:{'New file':B('a_up','Uploaded','p'),'Changes requested':B('a_re','Ready for review after changes','p')},Reviewers:{'Ready for review':B('a_ok','No changes'),'New file':B('a_ok','No changes')},Sarosh:{'Waiting for Sarosh':B('a_ap','Approve (PIN)','p')}}[ROLE];return m[st]||''}
const WAIT={Editors:{'Ready for review':'Waiting for the reviewer.','Waiting for Sarosh':'Reviewer is happy - waiting for Sarosh.','Approved':'Approved.'},Reviewers:{},Sarosh:{}};
function renderHead(i,cur){const k=keyOf(i),st=status(i),N=latest(i),ev=(type)=>send('v_event',{key:k,v:N,type,by:(($('#act_nm')||{}).value||'')}),last=evOf(k).pop();
 $('#hd').innerHTML=`<b style="font-size:16px">${esc(i.pillar)} / ${esc(i.lang)} / ${esc(i.code)}</b><span class="chip ${cls(st)}">${st}</span>
  <span class="tabs">${sources(i).map(s=>`<button aria-pressed="${s.lab===selV}" data-v="${s.lab}">${s.lab}${s.sub?' · '+s.sub:''}</button>`).join('')}</span><span style="flex:1"></span>
`;
 const ac=actions(i,cur,st);$('#act').innerHTML=ac?(ROLE!=='Sarosh'?`<input id="act_nm" placeholder="your name" size="14" value="${esc(NAME())}">`:'')+ac:(st==='Approved'?`<span class="mut">${esc(last?TAG.approved(last)+', '+last.at:'Approved (final file already in the folder)')}</span>`:`<span class="mut">${cur.v!==N?'Older version: buttons work on the latest.':(WAIT[ROLE]||{})[st]||'Nothing for you to do on this video.'}</span>`);
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{selV=b.dataset.v;pend=null;renderView()});
 const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
 on('a_up',()=>ev('uploaded'));on('a_re',()=>ev('resubmitted'));on('a_ok',()=>ev('ok'));on('a_chg',()=>ev('changes'));
 on('a_ap',async()=>{const pin=prompt('Sarosh PIN to approve. This copies the file to the final folder (an existing final goes to _old).');if(pin==null)return;if(await send('v_approve',{key:k,v:N,pin}))toast('Approved - file copied to the final folder')});
 if(ROLE==='Sarosh')renderHist(i);else $('#hist').innerHTML='';renderTags(i,cur)}
function renderTags(i,cur){const el=$('#tags');if(!el)return;const v=ROLE==='Editors'?(fixV(i)||cur.v):cur.v,k=keyOf(i),ev=evOf(k).filter(e=>e.v===v&&(e.type==='changes'||e.type==='ok'));
 el.innerHTML=ev.length?ev.map(e=>`<span class="chip ${e.type==='changes'?'s-Changes-requested':'s-Approved'}">${e.type==='changes'?'Changes':'OK'} by ${esc(e.by)} — ${esc(e.at)}</span>`).join(' '):'<span class="mut">No reviewer has finished yet.</span>'}
function renderHist(i){const k=keyOf(i),h=[...evOf(k).map(e=>({at:e.at,t:TAG[e.type](e)})),...D.docs.filter(d=>d.key===k).map(d=>({at:d.at,t:`Extra comments document by ${d.by} (v${d.v})`})),...i.versions.map(v=>({at:v.date||'',t:`v${v.v} file detected${v.name?' ("'+v.name+'")':''}`}))].sort((a,b)=>a.at<b.at?-1:1);
 $('#hist').innerHTML='<div class="sec">History</div><div class="hist">'+(h.map(x=>`<span><b>${esc(x.t)}</b> <span class="mut">${esc(x.at)}</span></span>`).join('')||'<span class="mut">Nothing yet.</span>')+'</div>'}
const NAME=()=>{try{return localStorage.getItem('vr_name')||''}catch(e){return''}},saveName=v=>{try{localStorage.setItem('vr_name',v)}catch(e){}};
const fixV=i=>{const c=evOf(keyOf(i)).filter(e=>e.type==='changes').pop();return c?c.v:0};   // version whose change list the editor must fix
async function send(action,b){if(busy){toast('Still saving…');return false}
 const by=(b.by||'').trim();if(!by&&!['v_approve','v_doc'].includes(action)){toast('Type your name next to the button first.');return false}if(by)saveName(by);
 busy=true;document.body.style.cursor='progress';
 try{await api(action,{...b,by});await load();return true}catch(e){toast('Not saved: '+e.message);return false}
 finally{busy=false;document.body.style.cursor=''}}
function renderView(keep){const i=item();if(!i){$('#view').innerHTML='';return}
 const src=sources(i);if(!selV||!src.some(s=>s.lab===selV))selV=src[src.length-1].lab;const cur=src.find(s=>s.lab===selV),old=$('#vid');
 if(keep&&old&&old.dataset.id===cur.id){renderHead(i,cur);renderDoc(i,cur);return}   // background refresh: never touch the player or the open doc
 $('#view').innerHTML=`<div class="card"><div class="bar2" id="hd"></div><div class="bar2" id="act"></div>
  <iframe id="vid" data-id="${cur.id}" src="https://drive.google.com/file/d/${cur.id}/preview" allow="autoplay; fullscreen" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000"></iframe><div id="tags" style="margin-top:10px;font-size:13px"></div></div>
  <div style="margin-top:16px" id="docbox"></div><div class="card" style="margin-top:16px" id="hist"></div>`;
 renderHead(i,cur);renderDoc(i,cur)}
/* ---------- the change list = one Google Doc per version (screenshots pasted by the reviewer) ---------- */
const DOC=id=>'https://docs.google.com/document/d/'+id, creating=new Set();
/* previous rounds, read-only: "Revision done - changes from v<r> (names) - fixed by <editor> <date>" */
function rounds(i,v){const k=keyOf(i),out=[];for(let r=1;r<v;r++){const all=D.docs.find(d=>d.key===k&&Number(d.v)===r&&d.by==='ALL');if(!all)continue;
 const names=[...new Set(evOf(k).filter(e=>e.type==='changes'&&e.v===r&&e.docId).map(e=>e.by))],fx=evOf(k).filter(e=>e.type==='resubmitted'&&e.v===r+1).pop();out.push({r,all,names,fx})}return out}
const recSig=(i,v)=>rounds(i,v).map(x=>x.r+x.all.docId+(x.fx?x.fx.by+x.fx.at:'')).join(',');
function recHTML(i,v){const lk=(u,t)=>`<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${u}">${t}</a>`;
 return rounds(i,v).map(x=>`<div class="card" style="margin-bottom:12px;border-style:dashed"><div class="bar2" style="margin:0"><b>Revision done — changes from v${x.r}</b><span class="mut">${x.names.map(esc).join(', ')} — ${x.fx?'fixed by '+esc(x.fx.by)+' '+esc(x.fx.at):'fix not marked yet'}</span><span style="flex:1"></span>${lk(DOC(x.all.docId)+'/edit','Open doc')}${lk(DOC(x.all.docId)+'/export?format=pdf','Download PDF')}</div><div class="mut">Record of an earlier round (read-only history).</div></div>`).join('')}
function docsFor(i,v){const k=keyOf(i),rec=i.versions.find(x=>x.v===v);if(!rec)return[];
 const evs=evOf(k).filter(e=>e.type==='changes'&&e.v===v&&e.docId),mk=(docId,by)=>{const e=evs.find(x=>x.docId===docId);return{docId,by:e?e.by:by,done:e||null}};
 return[mk(rec.doc,''),...D.docs.filter(d=>d.key===k&&Number(d.v)===v&&d.by!=='ALL').map(d=>mk(d.docId,d.by))]}
async function renderDoc(i,cur){const box=$('#docbox');if(!box)return;const k=keyOf(i);let v=cur.v;
 if(ROLE==='Editors'){const K=fixV(i),st=status(i);if(!(K&&(st==='Changes requested'||st==='New file'))){box.dataset.d='';box.innerHTML='<div class="card mut">No changes to fix right now.</div>';return}v=K}
 if(!v){box.dataset.d='';box.innerHTML='<div class="card mut">This video is already final.</div>';return}
 const rec=i.versions.find(x=>x.v===v);if(!rec)return;
 if(!rec.doc){if(creating.has(k+v))return;creating.add(k+v);box.innerHTML='<div class="card mut">Creating the change document…</div>';
  try{await api('v_doc',{key:k,v});await load()}catch(e){box.innerHTML='<div class="card mut">Could not create the document: '+esc(e.message)+'</div>'}creating.delete(k+v);return}
if(ROLE!=='Reviewers'){const all=D.docs.find(d=>d.key===k&&Number(d.v)===v&&d.by==='ALL'),done=evOf(k).filter(e=>e.type==='changes'&&e.v===v&&e.docId);
  if(!all){if(!done.length){box.dataset.d='r'+recSig(i,v);box.innerHTML=(ROLE==='Sarosh'?recHTML(i,v):'')+'<div class="card mut">No comments on this version yet.</div>';return}
   if(creating.has(k+v+'A'))return;creating.add(k+v+'A');box.innerHTML='<div class="card mut">Building the combined document…</div>';
   try{await api('v_refresh',{key:k,v});await load()}catch(e){box.innerHTML='<div class="card mut">Could not build the combined document: '+esc(e.message)+'</div>'}creating.delete(k+v+'A');return}
  const sg=ROLE+'|'+all.docId+'|'+done.length+'|'+recSig(i,v);if(box.dataset.d===sg)return;box.dataset.d=sg;
  const lk=(u,t)=>`<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${u}">${t}</a>`,pv=i.versions.find(x=>x.v===v-1);
  box.innerHTML=(ROLE==='Sarosh'?recHTML(i,v):'')+`<div class="card"><div class="bar2" style="margin-top:0"><b>All changes (v${v})</b><span class="mut">${done.map(e=>'Comments by '+esc(e.by)).join(' · ')}</span><span style="flex:1"></span><button id="rf">Refresh</button>${lk(DOC(all.docId)+'/edit','Open doc')}${lk(DOC(all.docId)+'/export?format=pdf','Download PDF')}</div>
   <div class="mut">One document with every reviewer's comments, in the order they finished. It rebuilds when a reviewer presses Changes done (or press Refresh).</div>
   <iframe src="${DOC(all.docId)}/edit?rm=minimal&embedded=true" style="width:100%;height:720px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px"></iframe></div>`;
  $('#rf').onclick=async()=>{box.dataset.d='';const b=$('#rf');b.disabled=true;b.textContent='Refreshing…';try{await api('v_refresh',{key:k,v});await load()}catch(e){toast('Refresh failed: '+e.message)}renderDoc(i,cur)};return}
 const docs=docsFor(i,v),sig=ROLE+'|'+docs.map(d=>d.docId+':'+(d.done?d.done.by:'')).join(',')+'|'+recSig(i,v);
 if(box.dataset.d===sig)return;box.dataset.d=sig;
 const prev=i.versions.find(x=>x.v===v-1),link=(u,t)=>`<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${u}">${t}</a>`,me=esc(NAME()),canEdit=ROLE==='Reviewers'&&v===latest(i);
 const card=(d,x)=>`<div class="card" style="margin-top:${x?12:0}px"><div class="bar2" style="margin-top:0"><b>${d.by?'Comments by '+esc(d.by):(x?'Comments':'Comments (v'+v+')')}</b>${d.done?`<span class="chip">Changes by ${esc(d.done.by)} · ${esc(d.done.at)}</span>`:'<span class="chip s-New-file">not finished</span>'}<span style="flex:1"></span>${x===0&&prev&&prev.doc?link(DOC(prev.doc)+'/edit','Previous version\'s changes'):''}${link(DOC(d.docId)+'/edit','Open doc')}${link(DOC(d.docId)+'/export?format=pdf','Download PDF')}</div>
  ${canEdit&&x===0&&!d.done?'<div class="mut">Pause the video, take a screenshot (Cmd+Shift+Ctrl+4), paste it (Cmd+V) in the doc below and write the timecode and the change.</div>':''}
  <iframe src="${DOC(d.docId)}/edit?rm=minimal&embedded=true" style="width:100%;height:${docs.length>1?560:700}px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px"></iframe>
  <div class="mut" style="margin-top:6px">${d.done?'Comments by '+esc(d.done.by)+' — Changes done '+esc(d.done.at):(d.by?'Comments by '+esc(d.by)+' — not finished':'Not finished')}</div>
  ${canEdit&&!d.done?`<div class="bar2"><input data-nm="${d.docId}" placeholder="your name" size="14" value="${me}"><button class="p" data-done="${d.docId}">Changes done</button></div>`:''}</div>`;
 box.innerHTML=(ROLE==='Reviewers'?recHTML(i,v):'')+(ROLE==='Editors'?`<div class="sec">Changes to fix (v${v}) - ${docs.length} document${docs.length>1?'s':''}</div>`:'')+docs.map(card).join('')+
  (canEdit?`<div class="card" style="margin-top:12px"><div class="bar2" style="margin-top:0"><input id="nd_by" placeholder="your name" size="14" value="${me}"><button id="nd">Add more comments</button><span class="mut">another reviewer gets their own blank document</span></div></div>`:'');
 box.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const nm=box.querySelector(`[data-nm="${b.dataset.done}"]`).value.trim();if(!nm){toast('Type your name first.');return}send('v_event',{key:k,v,type:'changes',docId:b.dataset.done,by:nm})});
 if($('#nd'))$('#nd').onclick=()=>{const nm=$('#nd_by').value.trim();if(!nm){toast('Type your name first.');return}send('v_newdoc',{key:k,v,by:nm})}}
const setRole=r=>{ROLE=r;try{localStorage.setItem('vr_role',r)}catch(e){}sel=null;pend=null;$('#view').innerHTML='<div class="card mut">Pick a video on the left.</div>';document.querySelectorAll('#roles button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===r));renderList()};
document.querySelectorAll('#roles button').forEach(b=>b.onclick=()=>setRole(b.dataset.r));document.querySelectorAll('#roles button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===ROLE));
$('#fs').onchange=renderList;
$('#mode').textContent=DEMO?'DEMO - local data, not the live sheet':'Editors upload, reviewers check, Sarosh approves';load();setInterval(load,120000);
</script></body></html>
