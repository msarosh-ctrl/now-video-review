<style>

video{width:100%;background:#000;border-radius:10px;max-height:58vh}.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}

.note img,.shot{width:150px;border-radius:8px;border:1px solid var(--line);background:#000;display:block}.tc{font-variant-numeric:tabular-nums;color:var(--blue);cursor:pointer;font-weight:600;border:0;background:none;padding:0}
.mut{color:var(--muted);font-size:13px}.fixed{opacity:.55}.prev{border:1.5px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px}
.note:not(:has(img)){grid-template-columns:1fr}.hist{font-size:13px;display:flex;flex-direction:column;gap:4px}.hist span b{font-weight:600}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--ink);color:var(--canvas);padding:8px 14px;border-radius:8px;display:none;max-width:90vw}
#pa{display:none}@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff}#pa .n{break-inside:avoid;display:grid;grid-template-columns:240px 1fr;gap:12px;border-top:1px solid #ccc;padding:8px 0}#pa img{width:240px}}
</style></head><body><div class="wrap"><header class="bar"><div class="brand"><h1>NOW <b>Video Review</b></h1><p id="mode"></p></div><div class="pick"><span class="seg" id="roles"><button data-r="Editors">Editors</button><button data-r="Reviewers">Reviewers</button><button data-r="Farah (English final check)">Farah (English final check)</button><button data-r="Final videos">Final videos</button></span><select id="fs"><option value="">All statuses</option><option>Not uploaded yet</option><option>New file</option><option>Ready for review</option><option>Changes requested</option><option>Waiting for approval</option><option>Waiting for Farah</option><option>Approved</option></select></div></header><main><div class="card" id="list">Loading…</div><div id="view"><div class="card mut">Pick a video on the left.</div></div></main></div><div id="msg"></div><div id="pa"></div>
<script src="config.js" onerror="void 0"></script>
<script>
const CFG=window.VR_CONFIG||{EXEC_URL:'',API_KEY:''}, DEMO=!CFG.EXEC_URL, $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q=new URLSearchParams(location.search), DEMO_BASE=Q.get('demo')==='nocors'?'http://localhost:18766/':'http://localhost:18767/';
const isCh=e=>e.type==='changes'||e.type==='farah_changes',FIN='Final videos',FAR='Farah (English final check)',isRev=()=>ROLE==='Reviewers'||ROLE===FAR;let ROLE=(()=>{try{const r=localStorage.getItem('vr_role');return['Editors','Reviewers',FAR,FIN].includes(r)?r:'Editors'}catch(e){return'Editors'}})();let D={docs:[],tree:[],notes:[],events:[],unclear:[]}, sel=null, selV=null, pend=null, shotCache={}, busy=false, closed=new Set();
function toast(m){const e=$('#msg');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',5000)}
/* ---------- data layer: Apps Script (live) or localStorage (demo) ---------- */
const DEMO_TREE=[{pillar:'MINDSET',lang:'ENGLISH',code:'MS01',final:null,versions:[{v:1,id:'demo_v1',name:'MS01 (1).mp4',date:'2026-10-20 09:10 UTC'},{v:2,id:'demo_v2',name:'MS01_fixed.mp4',date:'2026-10-21 12:40 UTC'}]},
 {pillar:'MINDSET',lang:'ENGLISH',code:'MS02',final:null,versions:[{v:1,id:'demo_v1',name:'MS02.mp4',date:'2026-10-21 08:00 UTC'}]},
 {pillar:'MINDSET',lang:'GERMAN',code:'MS01',final:{id:'demo_v1'},versions:[]},
 {pillar:'PROTECT',lang:'ITALIAN',code:'P01',final:null,versions:[{v:1,id:'demo_v1',name:'P01 ita.mp4',date:'2026-10-21 07:00 UTC'}]}];
const DEMO_UNCLEAR=[{pillar:'MINDSET',lang:'POLISH',name:'final render.mp4',why:'no code in the name'}];
const SEED={notes:[{id:'nseed1',key:'MINDSET|ENGLISH|MS01',v:1,tc:12.4,tcText:'00:12.400 (f372)',text:'Title is cut off on the right edge.',by:'Anna',at:'2026-10-20 10:05 UTC',shotId:'',fixed:false}],
 events:[{key:'MINDSET|ENGLISH|MS01',v:1,type:'uploaded',by:'Ed',at:'2026-10-20 09:12 UTC'},{key:'MINDSET|ENGLISH|MS01',v:1,type:'changes',by:'Anna',at:'2026-10-20 10:06 UTC'},{key:'MINDSET|ENGLISH|MS01',v:2,type:'resubmitted',by:'Ed',at:'2026-10-21 12:45 UTC'},
 {key:'MINDSET|ENGLISH|MS02',v:1,type:'uploaded',by:'Ed',at:'2026-10-21 08:05 UTC'},{key:'MINDSET|ENGLISH|MS02',v:1,type:'ok',by:'Anna',at:'2026-10-21 09:30 UTC'}]};
const ls=()=>JSON.parse(localStorage.getItem('vr_demo3')||JSON.stringify(SEED));
async function api(action,body){
  if(!DEMO){const r=body&&action!=='v_shot'?await fetch(CFG.EXEC_URL,{method:'POST',body:JSON.stringify({action,...body})}):await fetch(CFG.EXEC_URL+'?action='+action+'&'+new URLSearchParams(body||{}));
    const j=await r.json();if(!j.ok)throw new Error(j.message||j.code);return j}
  const s=ls(),save=()=>localStorage.setItem('vr_demo3',JSON.stringify(s)),b=body;
  if(action==='v_uploaded'){if(DEMO_TREE.some(i=>`${i.pillar}|${i.lang}|${i.code}`===b.key&&i.versions.length)){const s2=s;if(!s.events.some(e=>e.key===b.key&&(e.type==='uploaded'||e.type==='resubmitted')))s.events.push({key:b.key,v:1,type:'uploaded',by:b.by,at:nowS()});save();return{ok:1}}throw new Error('File not found yet in For Revision Renders/'+b.key.split('|')[0]+'/'+b.key.split('|')[1]+'/ - upload it first (name must contain '+b.key.split('|')[2]+').')}
  if(action==='v_all')return{ok:1,expected:{MINDSET:['MS01','MS02','MS03'],PROTECT:['P01'],'START NOW':['SH01']},langs:['ENGLISH','GERMAN'],tree:DEMO_TREE,notes:s.notes.map(n=>({...n,image:undefined})),events:s.events,docs:s.docs||[],comments:s.comments||[],unclear:DEMO_UNCLEAR};
  if(action==='v_shot')return{ok:1,data:(s.images||{})[b.id]||(s.notes.find(n=>n.shotId===b.id)||{}).image};
  if(action==='v_note'){const id='n'+Math.random().toString(36).slice(2,10);s.notes.push({id,key:b.key,v:b.v,tc:b.tc,tcText:b.tcText,text:b.text,by:b.by,at:nowS(),shotId:b.image?id:'',image:b.image,fixed:false});save();return{ok:1}}
  if(action==='v_fixed'){const n=s.notes.find(n=>n.id===b.id);n.fixed=b.on;n.fixedBy=b.by;save();return{ok:1}}
  if(action==='v_event'){s.events.push({key:b.key,v:b.v,type:b.type,by:b.by,at:nowS(),docId:b.docId||''});save();return{ok:1}}
  if(action==='v_doc'){DEMO_TREE.forEach(i=>i.versions.forEach(x=>{x.doc=x.doc||'demodoc'+x.v}));return{ok:1}}
  if(action==='v_comment_add'){s.comments=s.comments||[];if(!/\S/.test(b.html.replace(/<[^>]*>/g,''))&&!/<img/.test(b.html))throw new Error('Write something or paste a screenshot first.');const id='c'+Math.random().toString(36).slice(2,10);s.comments.push({id,key:b.key,v:b.v,by:b.by,html:b.html,at:nowS()});save();return{ok:1,id}}
  if(action==='v_comment_edit'||action==='v_comment_delete'){const c=(s.comments||[]).find(x=>x.id===b.id);if(!c)throw new Error('That comment no longer exists.');if(c.by.toLowerCase()!==b.by.toLowerCase())throw new Error('Only '+c.by+' can change this comment (type the same name).');if(action==='v_comment_delete')s.comments=s.comments.filter(x=>x.id!==b.id);else c.html=b.html;save();return{ok:1}}
  if(action==='v_image'){s.images=s.images||{};const id='img'+Math.random().toString(36).slice(2,12);s.images[id]=b.image;save();return{ok:1,id}}
  if(action==='v_refresh'){s.docs=s.docs||[];if(!s.docs.some(d=>d.key===b.key&&d.v===b.v&&d.by==='ALL'))s.docs.push({key:b.key,v:b.v,docId:'demoall',by:'ALL',at:nowS()});save();return{ok:1}}
  if(action==='v_newdoc'){s.docs=s.docs||[];const dup=s.docs.find(d=>d.key===b.key&&d.v===b.v&&d.by.toLowerCase()===b.by.toLowerCase());if(!dup){const first='demodoc'+b.v,claimed=s.docs.some(d=>d.key===b.key&&d.v===b.v&&d.docId===first);s.docs.push({key:b.key,v:b.v,docId:claimed?'demo'+Math.random().toString(36).slice(2,8):first,by:b.by,at:nowS()})}save();return{ok:1}}
  if(action==='v_farah_ok'){s.events.push({key:b.key,v:b.v,type:'farah_ok',by:'Farah',at:nowS()});save();return{ok:1}}
  if(action==='v_reopen'){if(b.pin!=='123456')throw new Error('Wrong PIN (demo PIN is 123456).');s.events.push({key:b.key,v:b.v,type:'reopened',by:'Sarosh',at:nowS()});save();return{ok:1}}
  if(action==='v_approve'){if(b.pin!=='123456')throw new Error('Wrong PIN (demo PIN is 123456).');s.events.push({key:b.key,v:b.v,type:'approved',by:'Sarosh',at:nowS()});save();return{ok:1}}
}
const nowS=()=>new Date().toISOString().slice(0,16).replace('T',' ')+' UTC';
const fileUrl=id=>DEMO?DEMO_BASE+id+'.mp4':`https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${CFG.API_KEY||D.apiKey||''}`;
/* ---------- status is DERIVED from the version history + notes + Final mark ---------- */
const keyOf=i=>`${i.pillar}|${i.lang}|${i.code}`, notesOf=(k,v)=>D.notes.filter(n=>n.key===k&&Number(n.v)===v), evOf=k=>D.events.map((e,x)=>[e,x]).filter(p=>p[0].key===k).sort((a,b)=>a[0].at<b[0].at?-1:a[0].at>b[0].at?1:a[1]-b[1]).map(p=>p[0]);
const latest=i=>Math.max(0,...i.versions.map(x=>x.v));
function status(i){if(i.ghost)return'Not uploaded yet';const k=keyOf(i),N=latest(i);if(!N)return i.final?'Approved':'New file';const e=evOf(k).pop();if(!e)return'New file';
 if(e.type==='reopened')return'Changes requested';
 if(e.type==='farah_ok'&&e.v===N)return'Waiting for approval';
 if(e.type==='ok'&&e.v===N&&i.lang==='ENGLISH')return'Waiting for Farah';
 if(e.type==='approved')return e.v===N?'Approved':'New file';
 if(e.v<N)return isCh(e)?'Changes requested':'New file';
 if(e.type==='resubmitted'&&i.lang==='ENGLISH'&&(evOf(k).filter(isCh).pop()||{}).type==='farah_changes')return'Waiting for Farah';   // Farah's changes: the fix goes straight back to her
 return{uploaded:'Ready for review',resubmitted:'Ready for review',changes:'Changes requested',farah_changes:'Changes requested',ok:'Waiting for approval'}[e.type]}
const cls=s=>'s-'+s.replace(/\s/g,'-');
const PORDER=['START NOW','MINDSET','PROTECT','GROW','MAKE'],pillars=g=>Object.keys(g).sort((a,b)=>(PORDER.indexOf(a)+1||99)-(PORDER.indexOf(b)+1||99)||a.localeCompare(b));
const chgNames=i=>{const N=latest(i),k=keyOf(i),n=evOf(k).filter(e=>isCh(e)&&e.v===N),up=evOf(k).filter(e=>(e.type==='uploaded'||e.type==='resubmitted')&&e.v===N).pop();
 const l1=isRev()&&up?(up.type==='uploaded'?'Uploaded by ':'Ready after changes by ')+esc(up.by)+' · '+esc(up.at):'',l2=n.length?n.map(e=>e.type==='farah_changes'?'Changes requested by Farah':'Changes by '+esc(e.by)).join(' · '):'';
 return l1||l2?`<br><span class="mut" style="font-size:12px">${[l1,l2].filter(Boolean).join('<br>')}</span>`:''};
const TAG={uploaded:e=>`Uploaded by ${e.by}`,resubmitted:e=>`Ready for review after changes - ${e.by}`,changes:e=>`Changes by ${e.by}`,ok:e=>`Approved by ${e.by}`,approved:e=>`Final approval by ${e.by}`,farah_ok:e=>`Approved by Farah - waiting for Sarosh`,farah_changes:e=>`Changes by ${e.by} (Farah)`,reopened:e=>`Sent back to review by ${e.by}`};
function withGhosts(){D.tree=(D.tree||[]).filter(i=>!i.ghost);const have=new Set(D.tree.map(keyOf)),ex=D.expected||{},lg=D.langs||[];   // expected videos with no file yet
 Object.keys(ex).forEach(p=>lg.forEach(l=>(ex[p]||[]).forEach(c=>{if(!have.has(p+'|'+l+'|'+c))D.tree.push({pillar:p,lang:l,code:c,final:null,versions:[],ghost:true})})))}
async function load(){if(!D.tree.length){try{const c=JSON.parse(localStorage.getItem('vr_cache')||'null');if(c&&c.tree){D=c;withGhosts();renderList()}}catch(e){}}try{D=await api('v_all');withGhosts();try{localStorage.setItem('vr_cache',JSON.stringify({expected:D.expected,langs:D.langs,tree:D.tree.filter(i=>!i.ghost),notes:D.notes,events:D.events,docs:D.docs,comments:D.comments,unclear:D.unclear,apiKey:D.apiKey}))}catch(e){}}catch(e){toast('Could not load: '+e.message);return}renderList();if(sel)renderView(true)}
const reopened=i=>(evOf(keyOf(i)).filter(x=>x.type==='approved'||x.type==='reopened').pop()||{}).type==='reopened';
function renderFinalList(){const f=$('#fs').value,wait=D.tree.filter(i=>status(i)==='Waiting for approval'),fin=D.tree.filter(i=>i.final&&!reopened(i)),g={};
 fin.forEach(i=>((g[i.pillar]??={})[i.lang]??=[]).push(i));
 const ap=i=>{const e=evOf(keyOf(i)).filter(x=>x.type==='approved').pop();return e?`Final - approved by ${esc(e.by)} · ${esc(e.at)}`:'approved earlier'},op=id=>closed.has(id)?'':'open';
 const wb=`<div class="sec">Waiting for approval (${wait.length})</div>`+(wait.length?wait.map(i=>`<div class="row ${sel===keyOf(i)?'sel':''}" data-k="${esc(keyOf(i))}"><span>${esc(i.pillar)} / ${esc(i.lang)} / ${esc(i.code)}</span><span class="chip s-Waiting-for-approval">Approve</span></div>`).join(''):'<div class="mut" style="padding:4px 8px">Nothing is waiting.</div>')+'<hr style="border:0;border-top:1px solid var(--line)">';
 const fb=`<div class="sec">Final videos (${fin.length})</div>`+(pillars(g).map(p=>`<details data-id="f${esc(p)}" ${op('f'+p)}><summary>${esc(p)}</summary>${Object.keys(g[p]).sort().map(l=>`<details data-id="f${esc(p+'/'+l)}" ${op('f'+p+'/'+l)} style="margin-left:10px"><summary class="mut">${esc(l)}</summary>${g[p][l].sort((a,b)=>a.code.localeCompare(b.code)).map(i=>`<div class="row ${sel===keyOf(i)?'sel':''}" data-k="${esc(keyOf(i))}"><span>${esc(i.code)}<br><span class="mut" style="font-size:12px">${ap(i)}</span></span><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://drive.google.com/file/d/${i.final.id}/view" onclick="event.stopPropagation()">Open</a> <button class="btn" data-back="${esc(keyOf(i))}">Send back to review</button></div>`).join('')}</details>`).join('')}</details>`).join('')||'<div class="mut" style="padding:4px 8px">No final videos yet.</div>');
 $('#list').innerHTML=wb+fb;
 document.querySelectorAll('#list details').forEach(d=>d.ontoggle=()=>d.open?closed.delete(d.dataset.id):closed.add(d.dataset.id));
 document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{sel=r.dataset.k;selV=null;pend=null;renderList();renderView()});
 document.querySelectorAll('[data-back]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const k=b.dataset.back,i=D.tree.find(x=>keyOf(x)===k),pin=prompt('Sarosh PIN to send '+k.replace(/\|/g,' / ')+' back to review. The final copy stays in the folder; editors can upload a new version.');if(pin==null)return;if(await send('v_reopen',{key:k,v:latest(i),pin}))toast('Sent back to review')})}
function renderList(){if(ROLE===FIN)return renderFinalList();const f=$('#fs').value,g={};
 const show={Editors:()=>true,Reviewers:(s,i)=>s==='Ready for review'||(s==='Changes requested'&&(evOf(keyOf(i)).pop()||{}).v===latest(i)),[FAR]:s=>s==='Waiting for Farah',[FIN]:()=>false};
 D.tree.forEach(i=>{const s=status(i);if((f&&s!==f)||!show[ROLE](s,i))return;((g[i.pillar]??={})[i.lang]??=[]).push([i,s])});
 const un=(D.unclear||[]).length?`<div class="prev" style="margin:0 0 8px"><b>${D.unclear.length} file(s) need a name with the video code</b> (e.g. MS01):<br>${D.unclear.map(u=>`<span class="mut">${esc(u.pillar)}/${esc(u.lang)}/${esc(u.name)} - ${esc(u.why)}</span>`).join('<br>')}</div>`:'';

 const wb='';
 const tb=todo.length?`<div class="sec">To do (${todo.length})</div>${todo.map(i=>`<div class="row" data-k="${esc(keyOf(i))}"><span>${esc(i.pillar)} / ${esc(i.lang)} / ${esc(i.code)}</span><span class="chip ${cls(status(i))}">${status(i)}</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--line)">`:'';
 $('#list').innerHTML=(ROLE==='Editors'?un:'')+tb+wb+(pillars(g).map(p=>`<details data-id="${esc(p)}" ${op(p)}><summary>${esc(p)}</summary>${Object.keys(g[p]).sort().map(l=>`<details data-id="${esc(p+'/'+l)}" ${op(p+'/'+l)} style="margin-left:10px"><summary class="mut">${esc(l)}</summary>${g[p][l].sort((a,b)=>a[0].code.localeCompare(b[0].code)).map(([i,s])=>`<div class="row ${sel===keyOf(i)?'sel':''}" data-k="${esc(keyOf(i))}"><span>${esc(i.code)} <span class="mut">${i.versions.length?'v'+latest(i):''}</span>${chgNames(i)}</span><span class="chip ${cls(s)}">${s}</span></div>`).join('')}</details>`).join('')}</details>`).join('')||'<span class="mut">'+({Editors:'No videos yet.',Reviewers:'Nothing is waiting for review.',[FAR]:'Nothing is waiting for Farah.',[FIN]:'Nothing here.'})[ROLE]+'</span>');
 document.querySelectorAll('#list details').forEach(d=>d.ontoggle=()=>d.open?closed.delete(d.dataset.id):closed.add(d.dataset.id));
 document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{sel=r.dataset.k;selV=null;pend=null;renderList();renderView()})}
const item=()=>D.tree.find(i=>keyOf(i)===sel);
function fmt(t){const ms=Math.floor(t*1000),m=Math.floor(ms/60000),s=(ms-m*60000)/1000;return String(m).padStart(2,'0')+':'+s.toFixed(3).padStart(6,'0')+' (f'+Math.round(t*30000/1001)+')'}
function sources(i){const fin=ROLE===FIN&&i.final&&i.versions.length?[{lab:'Final',v:0,id:i.final.id,sub:''}]:[];const a=i.versions.map(x=>({lab:'v'+x.v,v:x.v,id:x.id,sub:(x.date||'').slice(5,10)}));if(!a.length&&i.final)a.push({lab:'Final',v:0,id:i.final.id,sub:''});return [...a,...fin]}
function actions(i,cur,st){const N=latest(i),isLast=cur.v===N&&N>0;if(!isLast)return'';
 const B=(id,l,c)=>`<button id="${id}" class="${c||''}">${l}</button>`;
 const m={Editors:{'New file':B('a_up','Uploaded','p'),'Changes requested':B('a_re','Ready for review after changes','p')},Reviewers:{},[FAR]:{'Waiting for Farah':B('a_fa','Approve (Farah)','p')},[FIN]:{'Waiting for approval':B('a_ap','Approve (PIN)','p')}}[ROLE];return m[st]||''}
const WAIT={Editors:{'Ready for review':'Waiting for the reviewer.','Waiting for approval':'Approved - waiting for Sarosh.','Waiting for Farah':'Approved by reviewers - waiting for Farah.','Approved':'Approved.'},Reviewers:{},[FAR]:{},[FIN]:{}};
function renderHead(i,cur){const k=keyOf(i),st=status(i),N=latest(i),ev=(type)=>send('v_event',{key:k,v:N,type,by:(($('#act_nm')||{}).value||'')}),last=evOf(k).pop();
 $('#hd').innerHTML=`<b style="font-size:16px">${esc(i.pillar)} / ${esc(i.lang)} / ${esc(i.code)}</b><span class="chip ${cls(st)}">${st}</span>
  <span class="tabs">${sources(i).map(s=>`<button aria-pressed="${s.lab===selV}" data-v="${s.lab}">${s.lab}${s.sub?' · '+s.sub:''}</button>`).join('')}</span><span style="flex:1"></span>
`;
 const ac=actions(i,cur,st);$('#act').innerHTML=ac?(ROLE!==FIN&&ROLE!==FAR?`<input id="act_nm" placeholder="e.g. Cami" size="14" value="${esc(NAME())}">`:'')+ac:(st==='Approved'?`<span class="mut">${esc(last?TAG.approved(last)+', '+last.at:'Approved (final file already in the folder)')}</span>`:`<span class="mut">${cur.v!==N?'Older version: buttons work on the latest.':(WAIT[ROLE]||{})[st]||(isRev()?'':'Nothing for you to do on this video.')}</span>`);
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{selV=b.dataset.v;pend=null;renderView()});
 const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
 on('a_up',()=>send('v_uploaded',{key:k,by:(($('#act_nm')||{}).value||'')}));on('a_re',()=>ev('resubmitted'));on('a_ok',()=>ev('ok'));on('a_chg',()=>ev('changes'));
 on('a_ap',async()=>{const pin=prompt('Sarosh PIN to approve. This copies the file to the final folder (an existing final goes to _old).');if(pin==null)return;if(await send('v_approve',{key:k,v:N,pin}))toast('Approved - file copied to the final folder')});
 on('a_fa',()=>send('v_farah_ok',{key:k,v:N}));
 if(ROLE===FIN)renderHist(i);else $('#hist').innerHTML='';renderTags(i,cur)}
function renderTags(i,cur){const el=$('#tags');if(!el)return;const v=ROLE==='Editors'?(fixV(i)||cur.v):cur.v,k=keyOf(i),ev=evOf(k).filter(e=>e.v===v&&(isCh(e)||e.type==='ok'));
 el.innerHTML=ev.length?ev.map(e=>`<span class="chip ${isCh(e)?'s-Changes-requested':'s-Approved'}">${isCh(e)?'Changes':'OK'} by ${esc(e.by)} — ${esc(e.at)}</span>`).join(' '):'<span class="mut">No reviewer has finished yet.</span>'}
function renderHist(i){const k=keyOf(i),h=[...evOf(k).map(e=>({at:e.at,t:TAG[e.type](e)})),...D.docs.filter(d=>d.key===k).map(d=>({at:d.at,t:`Extra comments document by ${d.by} (v${d.v})`})),...i.versions.map(v=>({at:v.date||'',t:`v${v.v} file detected${v.name?' ("'+v.name+'")':''}`}))].sort((a,b)=>a.at<b.at?-1:1);
 $('#hist').innerHTML='<div class="sec">History</div><div class="hist">'+(h.map(x=>`<span><b>${esc(x.t)}</b> <span class="mut">${esc(x.at)}</span></span>`).join('')||'<span class="mut">Nothing yet.</span>')+'</div>'}
let revName='';const NAME=()=>'',saveName=v=>{};
const fixV=i=>{const c=evOf(keyOf(i)).filter(e=>isCh(e)).pop();return c?c.v:0};   // version whose change list the editor must fix
async function send(action,b){if(busy){toast('Still saving…');return false}
 const by=(b.by||'').trim();if(!by&&!['v_approve','v_farah_ok','v_reopen','v_doc'].includes(action)){toast('Type your name next to the button first.');return false}if(by)saveName(by);
 busy=true;document.body.style.cursor='progress';
 try{await api(action,{...b,by});await load();return true}catch(e){toast('Not saved: '+e.message);return false}
 finally{busy=false;document.body.style.cursor=''}}
function ghostView(i){const k=keyOf(i);$('#view').innerHTML=`<div class="card"><div class="bar2" style="margin-top:0"><b style="font-size:16px">${esc(i.pillar)} / ${esc(i.lang)} / ${esc(i.code)}</b><span class="chip ${cls('Not uploaded yet')}">Not uploaded yet</span></div>
 <p>Upload the video to <b>For Revision Renders / ${esc(i.pillar)} / ${esc(i.lang)} /</b> on Drive (the file name must contain <b>${esc(i.code)}</b>), then press Uploaded.</p>
 <div class="bar2"><input id="act_nm" placeholder="e.g. Cami" size="14" value="${esc(NAME())}"><button class="p" id="g_up">Uploaded</button></div></div>`;
 $('#g_up').onclick=async()=>{const nm=$('#act_nm').value.trim();if(await send('v_uploaded',{key:k,by:nm}))toast('Uploaded - the video is now in Reviewers')}}
function renderView(keep){const i=item();if(!i){$('#view').innerHTML='';return}if(i.ghost){ghostView(i);return}
 const src=sources(i);if(!selV||!src.some(s=>s.lab===selV))selV=(ROLE===FIN&&src.some(s=>s.lab==='Final')?'Final':src[src.length-1].lab);const cur=src.find(s=>s.lab===selV),old=$('#vid');
 if(keep&&old&&old.dataset.id===cur.id){renderHead(i,cur);renderDoc(i,cur);return}   // background refresh: never touch the player or the open doc
 $('#view').innerHTML=`<div class="card"><div class="bar2" id="hd"></div><div class="bar2" id="act"></div><div class="bar2" id="rvbar"></div>
  <iframe id="vid" data-id="${cur.id}" src="https://drive.google.com/file/d/${cur.id}/preview" allow="autoplay; fullscreen" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000"></iframe><div id="tags" style="margin-top:10px;font-size:13px"></div></div>
  <div style="margin-top:16px" id="docbox"></div><div class="card" style="margin-top:16px" id="hist"></div>`;
 renderHead(i,cur);renderDoc(i,cur)}
/* ---------- the change list = one Google Doc per version (screenshots pasted by the reviewer) ---------- */
const DOC=id=>'https://docs.google.com/document/d/'+id, creating=new Set();
/* ---------- our own comment editor (no Google Docs): one box per reviewer, text + pasted screenshots ---------- */
const imgCache={};
async function fillImgs(root){for(const im of root.querySelectorAll('img[data-i]')){if(im.getAttribute('src'))continue;const id=im.dataset.i;im.classList.add('cimg');
 try{if(!imgCache[id])imgCache[id]=(await api('v_shot',{id})).data;im.src=imgCache[id]}catch(e){im.alt='(image not available)'}}}
function zoomImg(src){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;align-items:center;justify-content:center;cursor:zoom-out';o.innerHTML='<img src="'+src+'" style="max-width:95vw;max-height:95vh">';o.onclick=()=>o.remove();document.body.appendChild(o)}
function cleanHTML(h){const d=new DOMParser().parseFromString('<body>'+(h||'')+'</body>','text/html'),ok=new Set(['P','DIV','BR','B','I','UL','OL','LI']);   // second line of defence after the server sanitizer
 const walk=(n,out)=>{n.childNodes.forEach(c=>{if(c.nodeType===3)out.append(document.createTextNode(c.textContent));else if(c.nodeType===1){const t=c.tagName;if(t==='IMG'){const id=c.getAttribute('data-i');if(/^[A-Za-z0-9_-]{10,80}$/.test(id||'')){const im=document.createElement('img');im.setAttribute('data-i',id);out.append(im)}}else if(ok.has(t)){const e=document.createElement(t.toLowerCase());walk(c,e);out.append(e)}}})};
 const o=document.createElement('div');walk(d.body,o);return o.innerHTML}
const hasText=h=>(h||'').replace(/<[^>]*>|&nbsp;|\s/g,'').length>0||/<img/.test(h||'');
const commentsOf=(k,v)=>(D.comments||[]).filter(c=>c.key===k&&Number(c.v)===v&&hasText(c.html));
const gdocLink=(k,v,by)=>{const e=evOf(k).filter(e=>isCh(e)&&e.v===v&&e.docId&&(!by||e.by.toLowerCase()===by.toLowerCase())).pop();return e?`<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${DOC(e.docId)}/edit">Earlier comments (Google Doc)</a>`:''};
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const sc=Math.min(1,1200/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};im.onerror=()=>rej(new Error('not an image'));im.src=u})}
const draftKey=(k,v,n)=>'vr_draft|'+k+'|'+v+'|'+n.toLowerCase(),memDraft={};
const getDraft=key=>{try{return localStorage.getItem(key)||memDraft[key]||''}catch(e){return memDraft[key]||''}},putDraft=(key,h)=>{memDraft[key]=h;try{h?localStorage.setItem(key,h):localStorage.removeItem(key)}catch(e){}};
const serEd=ed=>{const c=ed.cloneNode(true);c.querySelectorAll('img').forEach(im=>{const id=im.dataset.i;if(id){const n=document.createElement('img');n.setAttribute('data-i',id);im.replaceWith(n)}else im.remove()});return c.innerHTML};
function mountCompose(i,v,name,box,editing){const k=keyOf(i),ed=box.querySelector('.cbox'),st=box.querySelector('#csave'),dk=draftKey(k,v,name);let tm=null;
 ed.innerHTML=cleanHTML(editing?editing.html:getDraft(dk));fillImgs(ed);
 ed.addEventListener('input',()=>{st.textContent=editing?'Editing…':'Draft (not sent yet)';if(!editing){clearTimeout(tm);tm=setTimeout(()=>putDraft(dk,serEd(ed)),400)}});
 ed.addEventListener('click',e=>{if(e.target.tagName==='IMG')zoomImg(e.target.src)});
 ed.addEventListener('paste',async e=>{const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.type.indexOf('image/')===0);
  if(it){e.preventDefault();st.textContent='Uploading image…';try{const url=await shrink(it.getAsFile()),r=await api('v_image',{key:k,v,by:name,image:url});imgCache[r.id]=url;document.execCommand('insertHTML',false,`<img data-i="${r.id}" src="${url}" class="cimg"><br>`);ed.dispatchEvent(new Event('input'))}catch(er){st.textContent='Image not uploaded: '+er.message}return}
  const tx=e.clipboardData&&e.clipboardData.getData('text/plain');if(tx!=null){e.preventDefault();document.execCommand('insertText',false,tx)}});
 const submit=box.querySelector('#csubmit');
 submit.onclick=async()=>{const html=serEd(ed);if(!hasText(html)){toast('Write something or paste a screenshot first.');return}
  submit.disabled=true;st.textContent='Sending…';
  if(editing){const ok=await send('v_comment_edit',{id:editing.id,by:name,html});submit.disabled=false;if(ok){editing=null;editState=null;box.dataset.d='';renderView(true)}else st.textContent='Not saved - your text is kept';return}
  putDraft(dk,'');ed.innerHTML='';
  const ok=await send('v_comment_add',{key:k,v,by:name,html});submit.disabled=false;
  if(!ok){ed.innerHTML=cleanHTML(html);fillImgs(ed);putDraft(dk,html);st.textContent='Not sent - your text is kept'}else st.textContent='Sent ✓'};
 const cx=box.querySelector('#ccancel');if(cx)cx.onclick=()=>{editState=null;box.dataset.d='';renderView(true)};
 window.onbeforeunload=()=>hasText(serEd(ed))&&!editing?'You have an unsent comment.':undefined;return ed}
let editState=null;
/* previous rounds, read-only: "Revision done - changes from v<r> (names) - fixed by <editor> <date>" */
function rounds(i,v){const k=keyOf(i),out=[];for(let r=1;r<v;r++){const ch=evOf(k).filter(e=>isCh(e)&&e.v===r);if(!ch.length)continue;
 out.push({r,names:[...new Set(ch.map(e=>e.by))],fx:evOf(k).filter(e=>e.type==='resubmitted'&&e.v===r+1).pop(),all:D.docs.find(d=>d.key===k&&Number(d.v)===r&&d.by==='ALL')})}return out}
const recSig=(i,v)=>rounds(i,v).map(x=>x.r+x.names.join()+(x.fx?x.fx.by+x.fx.at:'')).join(',');
function recHTML(i,v){const lk=(u,t)=>`<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${u}">${t}</a>`;
 return rounds(i,v).map(x=>`<div class="card" style="margin-bottom:12px;border-style:dashed"><div class="bar2" style="margin:0"><b>Revision done — changes from v${x.r}</b><span class="mut">${x.names.map(esc).join(', ')} — ${x.fx?'fixed by '+esc(x.fx.by)+' '+esc(x.fx.at):'fix not marked yet'}</span><span style="flex:1"></span>${ROLE===FIN&&x.all?lk(DOC(x.all.docId)+'/edit','Open doc'):''}</div><div class="mut">Record of an earlier round (read-only history).</div></div>`).join('')}
/* combined panel for Editors / Final videos: every reviewer's comments of one version */
function combinedCards(i,v){const k=keyOf(i),cs=commentsOf(k,v),order=[],by={};cs.forEach(c=>{const n=c.by.toLowerCase();if(!by[n]){by[n]=[];order.push(n)}by[n].push(c)});
 const names=new Set(order),old=evOf(k).filter(e=>isCh(e)&&e.v===v&&e.docId&&!names.has(e.by.toLowerCase()));
 return order.map(n=>`<div class="card" style="margin-top:12px"><div class="bar2" style="margin:0"><b>Comments by ${esc(by[n][0].by)}</b><span class="mut">${by[n].length} comment${by[n].length>1?'s':''}</span><span style="flex:1"></span>${gdocLink(k,v,by[n][0].by)}</div>${by[n].map(c=>`<div class="citem"><div class="mut">${esc(c.by)} · ${esc(c.at)}</div><div class="cview">${cleanHTML(c.html)}</div></div>`).join('')}</div>`).join('')+
  old.map(e=>`<div class="card" style="margin-top:12px"><div class="bar2" style="margin:0"><b>Comments by ${esc(e.by)} — ${esc(e.at)}</b><span style="flex:1"></span>${gdocLink(k,v,e.by)}</div></div>`).join('')||'<div class="card mut" style="margin-top:12px">No comments yet.</div>'}
async function printPanel(i,v){const box=document.createElement('div');box.innerHTML=`<h2>${esc(i.pillar)} / ${esc(i.lang)} / ${esc(i.code)} — v${v} — comments</h2><p>${new Date().toISOString().slice(0,10)}</p>`+combinedCards(i,v).replace(/class="card"/g,'class="n"');await fillImgs(box);$('#pa').innerHTML=box.innerHTML;await new Promise(r=>setTimeout(r,400));window.print()}
async function renderDoc(i,cur){const box=$('#docbox');if(!box)return;const k=keyOf(i);let v=cur.v;if(!isRev()&&$('#rvbar'))$('#rvbar').innerHTML='';
 if(ROLE==='Editors'){const K=fixV(i),st=status(i),open=K&&(st==='Changes requested'||st==='New file');v=open?K:latest(i);if(!open&&!commentsOf(k,v).length&&!evOf(k).some(e=>isCh(e)&&e.v===v&&e.docId)){box.dataset.d='';box.innerHTML='<div class="card mut">No changes to fix right now.</div>';return}}
 if(!v){box.dataset.d='';box.innerHTML='<div class="card mut">This video is already final.</div>';return}
 if(!i.versions.find(x=>x.v===v))return;
 if(!isRev()){const cs=commentsOf(k,v),sg=ROLE+'|'+k+'|'+v+'|'+cs.map(c=>c.by+c.at).join()+'|'+evOf(k).length+'|'+recSig(i,v);if(box.dataset.d===sg)return;box.dataset.d=sg;
  box.innerHTML=(ROLE===FIN?recHTML(i,v):'')+`<div class="card"><div class="bar2" style="margin:0"><b>${ROLE==='Editors'?'Changes to fix':'All comments'} (v${v})</b><span style="flex:1"></span><button id="pp">Download PDF</button></div>${combinedCards(i,v)}</div>`;
  $('#pp').onclick=()=>printPanel(i,v);fillImgs(box);return}

 const me=revName.trim(),canEdit=v===latest(i),all=commentsOf(k,v);
 const sig='R|'+revName+'|'+canEdit+'|'+recSig(i,v)+'|'+all.map(c=>c.id+':'+c.html.length).join()+'|'+(editState?editState.id:'');
 const ask=canEdit?`<input id="rv_nm" placeholder="e.g. Cami" size="16" value="${esc(me)}"><button class="p" id="rv_open">Add comments</button>${ROLE==='Reviewers'?'<button id="rv_ok">No changes - Approved</button>':''}<span class="mut">${me?'Type another name to comment as that reviewer.':'Type your name, then write your comments below.'}</span>`:'';
 if($('#rvbar'))$('#rvbar').innerHTML=ask;
 if($('#rv_ok'))$('#rv_ok').onclick=()=>{const nm=$('#rv_nm').value.trim();if(!nm){toast('Type your name first.');return}send('v_event',{key:k,v,type:'ok',by:nm})};
 if($('#rv_open'))$('#rv_open').onclick=()=>{const nm=$('#rv_nm').value.trim();if(!nm){toast('Type your name first.');return}revName=nm;editState=null;box.dataset.d='';renderDoc(i,cur)};
 if(box.dataset.d===sig)return;
 const ae=document.activeElement;if(box.dataset.d&&ae&&ae.classList&&ae.classList.contains('cbox')&&box.contains(ae))return;   // never re-render under someone who is typing
 box.dataset.d=sig;
 const item=c=>{const mine=me&&c.by.toLowerCase()===me.toLowerCase()&&canEdit;return `<div class="citem"><div class="bar2" style="margin:0"><b>${esc(c.by)}</b><span class="mut">${esc(c.at)}</span><span style="flex:1"></span>${mine?`<button data-ed="${esc(c.id)}">Edit</button><button data-del="${esc(c.id)}">Delete</button>`:''}</div><div class="cview">${cleanHTML(c.html)}</div></div>`};
 const list=`<div class="card"><div class="bar2" style="margin:0"><b>Comments on this version (${all.length})</b></div>${all.map(item).join('')||'<div class="mut" style="margin-top:8px">No comments yet.</div>'}</div>`;
 const done=me?evOf(k).filter(e=>isCh(e)&&e.v===v&&e.by.toLowerCase()===me.toLowerCase()).pop():null;
 const comp=(me&&canEdit)?`<div class="card" style="margin-top:12px"><div class="bar2" style="margin-top:0"><b>${editState?'Edit comment':'New comment'} — ${esc(me)}</b><span id="csave" class="chip">${editState?'Editing':'Draft (not sent yet)'}</span>${done?`<span class="chip">Changes by ${esc(done.by)} · ${esc(done.at)}</span>`:''}<span style="flex:1"></span>${gdocLink(k,v,me)}</div>
  <div class="mut" style="margin-bottom:8px">Write what must change and paste screenshots with Cmd+V (take one with Cmd+Shift+Ctrl+4). Put the timecode in your text. Nothing is sent until you press the button.</div>
  <div class="cbox" contenteditable="true" data-ph="Type here, paste screenshots with Cmd+V…"></div>
  <div class="bar2"><button class="p" id="csubmit">${editState?'Save edit':'Submit comment'}</button>${editState?'<button id="ccancel">Cancel</button>':''}<span style="flex:1"></span><button id="rv_done">${ROLE===FAR?'Changes needed':'Changes done'}</button><span class="mut">tells the editor you finished</span></div></div>`:'';
 box.innerHTML=recHTML(i,v)+list+comp;fillImgs(box);
 box.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const c=all.find(x=>x.id===b.dataset.ed);editState={id:c.id,html:c.html};box.dataset.d='';renderDoc(i,cur)});
 box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this comment?'))send('v_comment_delete',{id:b.dataset.del,by:me})});
 if(me&&canEdit){const ed=mountCompose(i,v,me,box,editState);$('#rv_done').onclick=()=>send('v_event',{key:k,v,type:ROLE===FAR?'farah_changes':'changes',by:me})}}
const setRole=r=>{ROLE=r;try{localStorage.setItem('vr_role',r)}catch(e){}sel=null;pend=null;$('#view').innerHTML='<div class="card mut">Pick a video on the left.</div>';document.querySelectorAll('#roles button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===r));renderList()};
document.querySelectorAll('#roles button').forEach(b=>b.onclick=()=>setRole(b.dataset.r));document.querySelectorAll('#roles button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===ROLE));
$('#fs').onchange=renderList;
$('#mode').textContent=DEMO?'DEMO - local data, not the live sheet':'Editors upload, reviewers check, Sarosh approves in Final videos';load();setInterval(load,120000);
</script></body></html>
